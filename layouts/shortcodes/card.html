{{- $src := .Get "src" -}}
<div class="card-wrapper">
    <a href="{{ $src }}" target="_blank"
            rel="noopener noreferrer">
        {{ partial "media.html" (dict "page" .Page "src" $src "alt" (.Get "alt") "class" (.Get "class")) }}
    </a>
    <div>
        <p>{{ .Inner }}</p>
    </div>
</div>
