{{- with .cxt}} {{/* Apply proper context from dict */}}
{{- if (and .Params.cover.image (not $.isHidden)) }}
{{- $alt := (.Params.cover.alt | default .Params.cover.caption | plainify) }}
<figure class="entry-cover">
    {{- $addLink := (and site.Params.cover.linkFullImages (not $.IsHome)) }}
    {{- $isAbs := (urls.Parse .Params.cover.image).IsAbs }}
    {{- if $addLink }}<a href="{{ cond $isAbs .Params.cover.image (path.Join .RelPermalink .Params.cover.image) | absURL }}" target="_blank"
        rel="noopener noreferrer">{{ end -}}
    {{- /* Bundle covers get a srcset (or a looping video), external URLs are passed through */}}
    {{- partial "media.html" (dict
        "page" .
        "src" .Params.cover.image
        "alt" $alt
        "sizes" ($.sizes | default "(min-width: 768px) 720px, 100vw")
        "lazy" (not $.IsSingle)) }}
    {{- if $addLink }}</a>{{ end -}}
    {{/*  Display Caption  */}}
    {{- if not $.IsHome }}
        {{ with .Params.cover.caption }}<p>{{ . | markdownify }}</p>{{- end }}
    {{- end }}
</figure>
{{- end }}{{/* End image */}}
{{- end -}}{{/* End context */ -}}
